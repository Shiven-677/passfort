<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>PassFort test page</title>
</head>

<body style="font-family: sans-serif; max-width: 420px; margin: 40px auto;">
    <h1>Test signup</h1>
    <form action="http://example.com/signup" method="post" onsubmit="return false">
        <p><label>Name<br><input type="text" name="name" autocomplete="off"></label></p>
        <p><label>Email<br><input type="email" name="email" autocomplete="off"></label></p>
        <p><label>Username<br><input type="text" name="username" autocomplete="off"></label></p>
        <p><label>Password<br><input type="password" name="password" autocomplete="off"></label></p>
        <p><label>Confirm password<br><input type="password" name="confirm" autocomplete="off"></label></p>
        <button type="submit">Sign up</button>
    </form>
</body>

</html>
